<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>TravelPulse Content Studio</title>
  <meta name="description" content="TravelPulse Content Studio — powered by Base44." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="b44-shell">

    <header class="b44-header">
      <a class="b44-brand" href="https://app.base44.com/" target="_blank" rel="noopener noreferrer">
        <img class="b44-brand__mark" src="assets/base44-symbol.svg" alt="" width="28" height="28" />
        <span class="b44-brand__word">Base44</span>
      </a>
    </header>

    <main class="b44-main">
      <section class="b44-card">
        <h1 class="b44-title">
          <span class="b44-title__app">TravelPulse Content Studio</span>
          <span class="b44-title__state">isn't available yet</span>
        </h1>

        <p class="b44-lead">This app isn't available yet.</p>
        <p class="b44-sub">If you've been invited, you'll be able to access it once it's ready.</p>

        <div class="b44-cta">
          <p class="b44-cta__text">Want to build your own app?</p>
          <a class="b44-btn b44-btn--primary" href="https://app.base44.com/" target="_blank" rel="noopener noreferrer">
            Start building
          </a>
        </div>

        <div class="b44-cta">
          <p class="b44-cta__text">If you're the app admin, publish the app in Builder.</p>
          <a class="b44-btn b44-btn--ink" href="https://app.base44.com/" target="_blank" rel="noopener noreferrer">
            Open Base44 Builder
          </a>
        </div>

        <img class="b44-hero-mark" src="assets/base44-symbol.svg" alt="Base44" width="132" height="132" />
      </section>
    </main>

    <footer class="b44-footer">
      <a class="b44-badge" href="https://app.base44.com/" target="_blank" rel="noopener noreferrer">
        <span class="b44-badge__label">Edit with</span>
        <img class="b44-badge__mark" src="assets/base44-symbol.svg" alt="" width="18" height="18" />
        <span class="b44-badge__word">Base44</span>
      </a>
      <p class="b44-provenance" id="cloneNote"></p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
